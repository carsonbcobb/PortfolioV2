version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        # Full git history, so sitemap lastmod is each page's real last commit, not the clone's oldest.
        - git fetch --unshallow --quiet || true
        - npm ci
    build:
      commands:
        - npm run build
        - npm run check:terms
        - npm run check:placeholders
        # Sends changed URLs to IndexNow on production deploys only. Never fails the build.
        - node scripts/indexnow.mjs
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
